[app]
# assistant budgets count UTF-8 bytes as a conservative token estimate; override individual models when needed
# local presets (Ollama, LM Studio) and custom endpoints
assistant_input_tokens = 32000
# hosted presets (OpenAI, Anthropic, Gemini, xAI, DeepSeek, OpenRouter)
assistant_cloud_input_tokens = 64000
assistant_output_tokens = 4096
# 0 uses the provider's generation limit; input compaction stays unchanged
assistant_authoring_output_tokens = 0
assistant_model_budgets = {}
# authentication
token_expiration_hours = 120
auth_exclude_paths = [
  "/auth/login",
  "/user/count",
  "/user/create_admin",
  "/system/*",
]

# https://sanic.dev/en/guide/running/configuration.html
request_timeout = 60
response_timeout = 60
keep_alive_timeout = 120
fallback_error_format = "json"

# https://sanic.dev/en/plugins/sanic-ext/openapi/ui.html
oas_ui_redoc = false
oas_ui_default = "swagger"

[workspace]
temp = "{workspace}/temp"
cache = "{workspace}/cache"
images = "{workspace}/images"
database = "{workspace}/database"
transcoded = "{workspace}/transcoded"
repositories = "{workspace}/repositories"
